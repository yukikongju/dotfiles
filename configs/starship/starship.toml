# https://starship.rs/config/
# Combines:
#   - Catppuccin Powerline preset (rainbow gradient + ╭─╰─ box frame + vim character)
#   - fredericrous dotfiles (broad language coverage + git_state/commit + shell module)
# Inspiration:
#   https://starship.rs/presets/catppuccin-powerline.html
#   https://github.com/fredericrous/dotfiles/blob/main/private_dot_config/starship.toml
#
# Palette: change `palette =` below to mocha / frappe / latte / macchiato

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = true
palette       = "catppuccin_mocha"

# ==============================================================================
# Format — rainbow gradient: red → peach → yellow → green → sapphire → lavender
# Two-line prompt with ╭─ top / ╰─❯ bottom frame
# ==============================================================================
format = """
[╭─](fg:overlay0)\
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
$git_state\
$git_commit\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$scala\
$haskell\
$ocaml\
$swift\
$ruby\
$python\
[](fg:green bg:sapphire)\
$conda\
$docker_context\
$kubernetes\
$helm\
$terraform\
$aws\
[](fg:sapphire bg:lavender)\
$cmd_duration\
[](fg:lavender)\
$line_break\
$shell\
$character"""

right_format = """$time"""

# ==============================================================================
# Two-line character — ╰─❯ continuation
# ==============================================================================
[character]
disabled = false
format = """
[│](fg:overlay0)
[╰─](fg:overlay0)$symbol """
success_symbol            = '[](bold fg:green)'
error_symbol              = '[](bold fg:red)'
vimcmd_symbol             = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol     = '[❮](bold fg:lavender)'
vimcmd_visual_symbol      = '[❮](bold fg:yellow)'

# ==============================================================================
# OS icon (red segment)
# ==============================================================================
[os]
disabled = false
style    = "bg:red fg:crust"

[os.symbols]
Macos            = "󰀵"
Linux            = "󰌽"
Windows          = ""
Ubuntu           = "󰕈"
Arch             = "󰣇"
Debian           = "󰣚"
Fedora           = "󰣛"
Alpine           = ""
Manjaro          = ""
Raspbian         = "󰐿"
CentOS           = ""
Redhat           = "󱄛"
RedHatEnterprise = "󱄛"

# ==============================================================================
# Username (red segment) — aliases long GCP service-account email
# ==============================================================================
[username]
show_always = true
style_user  = "bg:red fg:crust"
style_root  = "bg:red fg:crust"
format      = '[ $user ]($style)'
aliases     = { "swe-service-account@relax-server.iam.gserviceaccount.com" = "swe@relax" }

[hostname]
ssh_only = true
style    = "bg:red fg:crust"
format   = '[@$hostname ]($style)'

# ==============================================================================
# Directory (peach segment)
# ==============================================================================
[directory]
style                     = "bg:peach fg:crust"
format                    = "[ $path$read_only ]($style)"
truncation_length         = 4
truncation_symbol         = "…/"
truncate_to_repo          = false
fish_style_pwd_dir_length = 1
read_only                 = " "
read_only_style           = "bg:peach fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "
"dotfiles"  = " dotfiles"

# ==============================================================================
# Git (yellow segment)
# ==============================================================================
[git_branch]
symbol = ""
style  = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style      = "bg:yellow"
format     = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'
conflicted = "="
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "\\$${count}"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[git_state]
style  = "bg:yellow"
format = '[[ \($state( $progress_current/$progress_total)\) ](fg:crust bg:yellow)]($style)'

[git_commit]
style          = "bg:yellow"
format         = '[[ \($hash$tag\) ](fg:crust bg:yellow)]($style)'
tag_disabled   = false
only_detached  = true

# ==============================================================================
# Languages (green segment) — only render when project files detected
# ==============================================================================
[c]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[rust]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[golang]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[nodejs]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[bun]
symbol = "🥟 "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[php]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[scala]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[ocaml]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[swift]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[ruby]
symbol = " "
style  = "bg:green"
format = '[[ $symbol($version) ](fg:crust bg:green)]($style)'

[python]
symbol = " "
style  = "bg:green"
format = '[[ $symbol$pyenv_prefix($version)( \($virtualenv\)) ](fg:crust bg:green)]($style)'

# ==============================================================================
# Cloud / infra (sapphire segment)
# ==============================================================================
[conda]
symbol      = " "
style       = "bg:sapphire"
format      = '[[ $symbol$environment ](fg:crust bg:sapphire)]($style)'
ignore_base = false

[docker_context]
symbol = " "
style  = "bg:sapphire"
format = '[[ $symbol$context ](fg:crust bg:sapphire)]($style)'

[kubernetes]
symbol   = "󱃾 "
style    = "bg:sapphire"
format   = '[[ $symbol$context ](fg:crust bg:sapphire)]($style)'
disabled = false

[helm]
symbol = "⎈ "
style  = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[terraform]
symbol = "󱁢 "
style  = "bg:sapphire"
format = '[[ $symbol$workspace ](fg:crust bg:sapphire)]($style)'

[aws]
symbol = "☁ "
style  = "bg:sapphire"
format = '[[ $symbol$profile ](fg:crust bg:sapphire)]($style)'

# ==============================================================================
# Cmd duration (lavender segment, rightmost)
# ==============================================================================
[cmd_duration]
min_time           = 2000
show_milliseconds  = false
style              = "bg:lavender"
format             = '[[  $duration ](fg:crust bg:lavender)]($style)'
show_notifications = true
min_time_to_notify = 45000

# ==============================================================================
# Shell + time
# ==============================================================================
[shell]
fish_indicator       = ""
bash_indicator       = "bash "
zsh_indicator        = ""
powershell_indicator = "_"
style                = "fg:subtext0"
format               = "[$indicator]($style)"
disabled             = false

[time]
disabled    = false
time_format = "%R"
style       = "fg:overlay1"
format      = "[ $time ]($style)"

# ==============================================================================
# Disabled modules
# ==============================================================================
[package]
disabled = true

[shlvl]
disabled = true

#[memory_usage]
#symbol   = " "
#style    = "bg:sapphire"
#format   = '[[ $symbol$ram ](fg:crust bg:sapphire)]($style)'
#threshold = 95
#disabled = false

