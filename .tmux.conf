######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g mode-style 'fg=#1e1e2e bg=#cba6f7 bold'

# statusbar - catppuccin mocha theme
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour235 fg=colour246'
set -g status-left '#[fg=#cdd6f4,bg=#45475a] #{session_name} #[bg=colour235] '
set -g status-right '#[fg=#cdd6f4,bg=#45475a] %d/%m #[bg=#1e1e2e] #[fg=#1e1e2e,bg=#cba6f7] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 50
set -g status on

# active window - mauve accent (colour141)
setw -g window-status-current-style 'fg=colour235 bg=colour141 bold'
setw -g window-status-current-format ' #I#[fg=colour241]:#[fg=colour232]#W#[fg=colour241]#F '

# inactive window - muted gray
setw -g window-status-style 'fg=colour246 bg=colour235'
setw -g window-status-format ' #I#[fg=colour240]:#[fg=colour248]#W#[fg=colour240]#F '

# bell notification - peach (colour203)
setw -g window-status-bell-style 'fg=colour235 bg=colour203 bold'

# messages - rename window prompt
set -g message-style 'fg=colour235 bg=colour141 bold'

#######################################################################
#                               Plugins                               #
#######################################################################

# reload: prefix + r
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-autoreload'
set -g @plugin 'christoomey/vim-tmux-navigator' # prefix + I to download plugins
# set -g @plugin 'erikw/tmux-powerline'
# set -g @plugin 'tmux-plugins/tmux-copycat'

# copy to system clipboard 
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

