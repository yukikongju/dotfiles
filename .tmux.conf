### TERMINAL COLORS ###

set -g default-terminal "screen-256color"
# set -g default-terminal "xterm-256color"
# alias tmux='tmux -2'
# set-window-option -g window-style 'bg=colour235'

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback history
set -g history-limit 50000

# Renumber windows automatically when closing
set -g renumber-windows on

# default statusbar colors
# set-option -g status-bg colour235
# set-option -g status-fg colour179
# set-option -g status-attr default
set -g status-style "fg=colour179,bg=colour235"


# default window title colors
# set-window-option -g window-status-fg colour244
# set-window-option -g window-status-bg default
setw -g window-status-style "fg=colour244,bg=default"

# active window title colors
# set-window-option -g window-status-current-fg colour166
# set-window-option -g window-status-current-bg default
# set-window-option -g window-status-current-attr bright
setw -g window-status-current-style "fg=colour166,bg=default,bold"

# pane border - catppuccin mocha inspired (with visible gaps)
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines heavy

# pane number display
set -g display-panes-active-colour colour141
set -g display-panes-colour colour168

# clock
set-window-option -g clock-mode-colour colour150

### KEYS ###

# enable copy mode in vim
setw -g mode-keys vi

# make escape key faster
set -s escape-time 0
set -g status-interval 0

# Reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Remap prefix from 'Ctrl-b' to 'Ctrl-s'
set -g prefix C-s
unbind C-b
bind C-s send-prefix
# tmux show -g prefix # note: verify that mapping is ctrl+s

# open panes in same directory
bind c new-window -c "#{pane_current_path}" 
# bind C-f 'run-shell' "tmux split-window -c '#{pane_current_path}' 'vim ./%'"

# Split panes using prefix with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Activate mouse
# set -g mouse on
setw -g mouse on

# unbind control key for tmux (but keep C-l for clearing)
unbind-key C-h
unbind-key C-j
unbind-key C-k
unbind-key C-l

# FIXME: need to debug w/ Rectangle Integration on MacOS
# switch panes using prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R # keeping ctrl+l for "clear"

# Switch panes using Alt-arrow without prefix (window)
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# bind -n M-S-h select-pane -L
# bind -n M-S-l select-pane -R
# bind -n M-S-k select-pane -U
# bind -n M-S-j select-pane -D

# Resize panes using shift-arrow keys
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

